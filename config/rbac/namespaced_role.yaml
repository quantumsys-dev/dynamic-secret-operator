  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dso.quantumsys.dev
  resources:
  - dynamicsecretpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - dso.quantumsys.dev
  resources:
  - dynamicsecretpolicies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
