{{- if and .Values.rbac.create (eq .Values.rbac.scope "Namespaced") }}
{{- $namespaces := .Values.rbac.watchNamespaces | default (list .Release.Namespace) }}
{{- $fullName := include "dso.fullname" . }}
{{- $labels := include "dso.labels" . }}
{{- $saName := include "dso.serviceAccountName" . }}
{{- $releaseNs := .Release.Namespace }}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-manager-rolebinding
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $releaseNs }}
{{- end }}
{{- end }}
