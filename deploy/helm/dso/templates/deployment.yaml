apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dso.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dso.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dso.selectorLabels" . | nindent 8 }}
        {{- if .Values.azure.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dso.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --event-buffer-size={{ .Values.controller.eventBufferSize | default 1000 }}
            - --max-concurrent-reconciles={{ .Values.controller.maxConcurrentReconciles | default 5 }}
            - --sync-period={{ .Values.controller.syncPeriod | default "5m" }}
            {{- if eq .Values.rbac.scope "Namespaced" }}
            {{- $watchNamespaces := .Values.rbac.watchNamespaces | default (list .Release.Namespace) }}
            - --watch-namespaces={{ join "," $watchNamespaces }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- if and .Values.azure.workloadIdentity.enabled .Values.azure.workloadIdentity.clientId }}
            - name: AZURE_CLIENT_ID
              value: {{ .Values.azure.workloadIdentity.clientId | quote }}
            {{- end }}
            {{- if and .Values.azure.workloadIdentity.enabled .Values.azure.workloadIdentity.tenantId }}
            - name: AZURE_TENANT_ID
              value: {{ .Values.azure.workloadIdentity.tenantId | quote }}
            {{- end }}
            {{- if .Values.azure.serviceBus.namespace }}
            - name: SERVICEBUS_NAMESPACE
              value: {{ .Values.azure.serviceBus.namespace | quote }}
            {{- end }}
            {{- if .Values.azure.serviceBus.queueName }}
            - name: SERVICEBUS_QUEUE_NAME
              value: {{ .Values.azure.serviceBus.queueName | quote }}
            {{- end }}
            {{- if .Values.argoCD.autoPatch }}
            - name: ARGOCD_AUTOPATCH_ENABLED
              value: "true"
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
