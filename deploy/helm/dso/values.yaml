# Default values for dynamic-secret-operator.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/quantumsys-dev/dynamic-secret-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.2.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Role-Based Access Control (RBAC) configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # Scope of RBAC permissions: "Cluster" (ClusterRole/ClusterRoleBinding) or "Namespaced" (Role/RoleBinding)
  # In high-security / multi-tenant clusters, set to "Namespaced" to eliminate cluster-wide secret access.
  scope: "Cluster"
  # When scope is "Namespaced", list of namespaces where DSO will have permissions (defaults to release namespace if empty)
  watchNamespaces: []

# Azure Workload Identity configuration
azure:
  workloadIdentity:
    enabled: true
    # Mandatory Azure User-Assigned Managed Identity Client ID
    clientId: ""
    # Optional Azure AD Tenant ID
    tenantId: ""

  # Azure Service Bus configuration for event-driven secret rotation
  serviceBus:
    # Full Service Bus namespace FQDN, e.g. "myns.servicebus.windows.net"
    namespace: ""
    # Name of the queue receiving Key Vault EventGrid events
    queueName: ""

# Argo CD GitOps integration
argoCD:
  # Automatically discover and patch parent Argo CD Application ignoreDifferences
  # to prevent Self-Heal drift loops on operator-managed secret revisions.
  autoPatch: false

# Controller tuning & configuration
controller:
  # Buffer capacity for the internal event channel bridging Azure Service Bus to the controller watch queue
  eventBufferSize: 1000
  # Maximum number of concurrent reconciliation workers for high-throughput secret rollouts
  maxConcurrentReconciles: 5

# Pod Security Admission (PSA) Restricted compliant security contexts
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

metrics:
  port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    additionalRuleLabels: {}

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

