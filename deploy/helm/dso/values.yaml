# Default values for dynamic-secret-operator.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/quantumsys-dev/dynamic-secret-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.2.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Role-Based Access Control (RBAC) configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # Scope of RBAC permissions: "Cluster" (ClusterRole/ClusterRoleBinding) or "Namespaced" (Role/RoleBinding)
  # In high-security / multi-tenant clusters, set to "Namespaced" to eliminate cluster-wide secret access.
  scope: "Cluster"
  # When scope is "Namespaced", list of namespaces where DSO will have permissions (defaults to release namespace if empty)
  watchNamespaces: []

# Operating mode of DSO: "event-driven" or "eso"
# - "event-driven": Direct sub-second push notifications from cloud message queues (Azure Service Bus, AWS SQS, GCP Pub/Sub).
# - "eso": Decoupled universal multi-cloud mode via External Secrets Operator (zero cloud credentials required in DSO).
mode: "event-driven"

# Secret provider backend (required only when mode: "event-driven"):
# - "azure": Microsoft Azure Key Vault & Azure Service Bus (Production Ready)
# - "aws": AWS Secrets Manager & Amazon SQS (In Development - Roadmap v0.3)
# - "gcp": Google Cloud Secret Manager & Cloud Pub/Sub (In Development - Roadmap v0.3)
# Note: In "eso" mode, provider is not used (simply configure mode: "eso").
provider: "azure"

# Azure Workload Identity configuration (used when mode: "event-driven" and provider: "azure")
azure:
  workloadIdentity:
    enabled: true
    # Mandatory Azure User-Assigned Managed Identity Client ID
    clientId: ""
    # Optional Azure AD Tenant ID
    tenantId: ""

  # Azure Service Bus configuration for event-driven secret rotation
  serviceBus:
    # Full Service Bus namespace FQDN, e.g. "myns.servicebus.windows.net"
    namespace: ""
    # Name of the queue receiving Key Vault EventGrid events
    queueName: ""

# AWS configuration (In Development - Roadmap v0.3; used when mode: "event-driven" and provider: "aws")
aws:
  enabled: false
  # AWS IAM Role ARN for Service Accounts (IRSA) or EKS Pod Identity
  roleArn: ""
  # SQS queue URL receiving rotation notifications
  sqs:
    queueUrl: ""
  # AWS Region
  region: ""

# Google Cloud Platform configuration (In Development - Roadmap v0.3; used when mode: "event-driven" and provider: "gcp")
gcp:
  enabled: false
  # Google Cloud Workload Identity Service Account email
  workloadIdentity:
    serviceAccount: ""
  # Cloud Pub/Sub Subscription ID
  pubsub:
    subscription: ""

# Argo CD GitOps integration
argoCD:
  # Automatically discover and patch parent Argo CD Application ignoreDifferences
  # to prevent Self-Heal drift loops on operator-managed secret revisions.
  autoPatch: false

# Controller tuning & configuration
controller:
  # Buffer capacity for the internal event channel bridging Azure Service Bus to the controller watch queue
  eventBufferSize: 1000
  # Maximum number of concurrent reconciliation workers for high-throughput secret rollouts
  maxConcurrentReconciles: 5
  # Full resync period for the manager's cache. Bounds how long a DynamicSecretPolicy can go
  # without a fresh drift-check against its source if an external rotation event is ever lost.
  syncPeriod: "5m"

# Pod Security Admission (PSA) Restricted compliant security contexts
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

metrics:
  port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    additionalRuleLabels: {}

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

