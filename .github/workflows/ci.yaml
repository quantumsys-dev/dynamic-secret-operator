name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint & Code Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          args: --timeout=5m

  test:
    name: Run Unit & Integration Tests (envtest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Envtest
        uses: kubernetes-sigs/controller-runtime/envtest-setup-action@v1.2.0
        with:
          version: '1.31.x'

      - name: Run Tests
        # The envtest action automatically exports KUBEBUILDER_ASSETS
        run: go test -v -race -count=1 ./api/... ./internal/... ./pkg/...

  e2e:
    name: E2E Tests (Kind)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: dso-e2e

      - name: Build Local Operator Image
        run: |
          docker build -t quantumsys-dev/dso:e2e -t ghcr.io/quantumsys-dev/dynamic-secret-operator:e2e .
          kind load docker-image ghcr.io/quantumsys-dev/dynamic-secret-operator:e2e --name dso-e2e || true
          kind load docker-image quantumsys-dev/dso:e2e --name dso-e2e || true

      - name: Run E2E Tests
        run: go test -v -timeout 15m ./test/e2e/...
