name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint & Code Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5 run --timeout=5m

  test:
    name: Run Unit & Integration Tests (envtest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install setup-envtest and download k8s control-plane binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19
          K8S_ASSETS_DIR="$(setup-envtest use 1.31.0 -p path)"
          echo "KUBEBUILDER_ASSETS=${K8S_ASSETS_DIR}" >> $GITHUB_ENV

      - name: Run Tests
        run: go test -v -race -count=1 ./api/... ./internal/... ./pkg/...

  e2e:
    name: E2E Tests (Kind)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Create Kind Cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: dso-e2e

      - name: Build Local Operator Image
        run: |
          docker build -t quantumsys-dev/dso:e2e -t ghcr.io/quantumsys-dev/dynamic-secret-operator:e2e .
          kind load docker-image ghcr.io/quantumsys-dev/dynamic-secret-operator:e2e --name dso-e2e || true
          kind load docker-image quantumsys-dev/dso:e2e --name dso-e2e || true

      - name: Run E2E Tests
        run: go test -v -timeout 15m ./test/e2e/...
