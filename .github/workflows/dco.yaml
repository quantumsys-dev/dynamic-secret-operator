name: DCO Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: Check DCO (Sign-off)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify DCO Sign-off
        uses: tibdex/dco@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
