name: DCO Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  dco:
    name: Check DCO (Sign-off)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify DCO Sign-off
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.event.after }}"
            if [ "$RANGE" == "0000000000000000000000000000000000000000..${{ github.event.after }}" ]; then
              RANGE="HEAD~1..HEAD"
            fi
          fi

          echo "Checking commits in range: $RANGE"
          FAILED=0
          
          for commit in $(git rev-list $RANGE); do
            if ! git log --format=%B --no-merges -n 1 $commit | grep -q "Signed-off-by:"; then
              echo "❌ Commit $(git rev-parse --short $commit) lacks a 'Signed-off-by' sign-off."
              git log --format="%s" -n 1 $commit
              FAILED=1
            else
              echo "✅ Commit $(git rev-parse --short $commit) is properly signed off."
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "----------------------------------------------------"
            echo "Error: One or more commits are missing a Developer Certificate of Origin (DCO) sign-off."
            echo "Please fix your commits using: git commit --amend -s"
            echo "----------------------------------------------------"
            exit 1
          fi
