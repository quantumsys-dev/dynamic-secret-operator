name: Release & Supply Chain Security

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write # Required for creating release tags and attaching SBOM release assets
  id-token: write # Strictly required for Sigstore / Cosign keyless OIDC signing
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release:
    name: Build, Scan, Sign and Publish
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      digest: ${{ steps.docker-build-push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build local Docker image for vulnerability scanning
        id: docker-build-local
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push production Docker image to GHCR
        id: docker-build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image keylessly with Cosign (Sigstore OIDC)
        run: |
          echo "Signing image digest ${{ steps.docker-build-push.outputs.digest }}..."
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.docker-build-push.outputs.digest }}"

      - name: Generate and attach SBOM (Syft / Anchore)
        uses: anchore/sbom-action@v0.17.7
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.docker-build-push.outputs.digest }}
          format: spdx-json
          output-file: dso-operator-sbom.spdx.json

      - name: Attest SBOM with Cosign
        run: |
          cosign attest --yes --predicate dso-operator-sbom.spdx.json --type spdxjson "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.docker-build-push.outputs.digest }}"

      - name: Upload SBOM as release artifact
        uses: actions/upload-artifact@v7
        with:
          name: dso-operator-sbom
          path: dso-operator-sbom.spdx.json
          retention-days: 90

      - name: Setup Helm
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Package & Push Helm Chart (OCI)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p .dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/dso --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}" -d .dist
          helm push .dist/dynamic-secret-operator-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  provenance:
    name: Generate SLSA Level 3 Provenance
    needs: [build-and-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      id-token: write
      contents: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build-and-release.outputs.image }}
      digest: ${{ needs.build-and-release.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}


