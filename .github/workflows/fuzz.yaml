name: Continuous Fuzzing

on:
  schedule:
    - cron: '0 2 * * *' # Run nightly at 02:00 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Duration to run fuzzing (e.g. 5m, 10m, 30m)'
        required: false
        default: '10m'

permissions:
  contents: read

jobs:
  fuzz:
    name: Deep Fuzz Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Deep Fuzzing (FuzzSanitizeDBError)
        run: |
          FUZZ_TIME="${{ github.event.inputs.fuzztime || '10m' }}"
          go test -fuzz=FuzzSanitizeDBError -fuzztime=${FUZZ_TIME} ./internal/probes/...
