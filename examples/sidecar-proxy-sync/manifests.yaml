apiVersion: v1
kind: Secret
metadata:
  name: sidecar-api-service-app-api-key-initial
  namespace: default
type: Opaque
stringData:
  api-key: "v1-initial-token-secret-data"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar-api-service
  namespace: default
  labels:
    app: sidecar-api-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sidecar-api-service
  template:
    metadata:
      labels:
        app: sidecar-api-service
    spec:
      containers:
        # 1. Main Service Container
        - name: api-service
          image: hashicorp/http-echo:latest
          args: ["-text=Active API Service running with DSO sidecar sync\n"]
          ports:
            - containerPort: 5678
              name: http
          volumeMounts:
            - name: app-secret-volume
              mountPath: /etc/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 2
            periodSeconds: 5

        # 2. Secret Reloader Sidecar Container
        - name: secret-reloader
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting sidecar secret watcher on /etc/secrets/api-key..."
              LAST_HASH=""
              while true; do
                if [ -f /etc/secrets/api-key ]; then
                  CURRENT_HASH=$(sha256sum /etc/secrets/api-key | cut -d' ' -f1)
                  if [ -n "$LAST_HASH" ] && [ "$CURRENT_HASH" != "$LAST_HASH" ]; then
                    echo "========================================================"
                    echo "🔄 [$(date +'%Y-%m-%d %H:%M:%S')] Secret rotation detected!"
                    echo "Old Hash: $LAST_HASH -> New Hash: $CURRENT_HASH"
                    echo "Notifying main application process (triggering reload)..."
                    # In production: wget -q -O- --post-data="" http://127.0.0.1:5678/-/reload || true
                    echo "✅ Application reload successfully triggered."
                    echo "========================================================"
                  fi
                  LAST_HASH="$CURRENT_HASH"
                fi
                sleep 2
              done
          volumeMounts:
            - name: app-secret-volume
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: app-secret-volume
          secret:
            secretName: sidecar-api-service-app-api-key-initial
---
apiVersion: v1
kind: Service
metadata:
  name: sidecar-api-service
  namespace: default
spec:
  selector:
    app: sidecar-api-service
  ports:
    - name: http
      port: 80
      targetPort: 5678
  type: ClusterIP
---
apiVersion: dso.quantumsys.dev/v1alpha1
kind: DynamicSecretPolicy
metadata:
  name: sidecar-api-service-policy
  namespace: default
spec:
  vaultRef:
    keyVaultURI: "https://my-enterprise-vault.vault.azure.net"
    objectName: "app-api-key"
    objectType: "Secret"
  workloadSelector:
    kind: "Deployment"
    name: "sidecar-api-service"
  targetRef:
    volumeName: "app-secret-volume"
  validationProbes:
    - type: "HTTP"
      endpoint: "http://127.0.0.1:5678/"
      expectedStatus: 200
      queryTimeout: 5
  rollbackConfig:
    autoRollback: true
    circuitBreakerThreshold: 3
