apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypto-tracker-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/quantumsys-dev/dynamic-secret-operator.git
    targetRevision: HEAD
    path: examples/nginx-color-rotation
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
  labels:
    app.kubernetes.io/instance: crypto-tracker-app
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        location / {
          try_files $uri $uri/ /index.html;
        }
      }
    }
  index.html.template: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dynamic Secret Operator – Live Rotation Demo</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-color: __BACKGROUND_COLOR__;
                --card-bg: rgba(0, 0, 0, 0.45);
                --border-color: rgba(255, 255, 255, 0.12);
                --text-color: #ffffff;
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: 'Inter', sans-serif;
                background-color: var(--bg-color);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                color: var(--text-color);
                transition: background-color 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .card {
                background: var(--card-bg);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid var(--border-color);
                border-radius: 24px;
                padding: 48px;
                width: 460px;
                text-align: center;
                box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
            }
            h1 { font-size: 20px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.85; margin-bottom: 16px; }
            .secret-val { font-size: 38px; font-weight: 800; margin: 24px 0; color: #54a0ff; letter-spacing: -1px; }
            .badge { display: inline-block; padding: 8px 16px; background: rgba(16, 185, 129, 0.2); color: #10b981; border-radius: 12px; font-weight: 600; font-size: 13px; margin-top: 12px; }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Dynamic Secret Operator</h1>
            <p>Live Injected Secret Value:</p>
            <div class="secret-val">__BACKGROUND_COLOR__</div>
            <div class="badge">● Live Zero-Downtime Secret Sync</div>
        </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-crypto-tracker
  namespace: default
  labels:
    app: nginx-crypto-tracker
    app.kubernetes.io/instance: crypto-tracker-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-crypto-tracker
  template:
    metadata:
      labels:
        app: nginx-crypto-tracker
        app.kubernetes.io/instance: crypto-tracker-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - |
              SECRET_FILE="/mnt/secrets/secret-val/database-password"
              if [ -f "$SECRET_FILE" ]; then
                COLOR=$(cat "$SECRET_FILE")
              else
                COLOR="#1e3799"
              fi
              sed "s/__BACKGROUND_COLOR__/$COLOR/g" /usr/share/nginx/html/index.html.template > /usr/share/nginx/html/index.html
              nginx -g 'daemon off;'
          volumeMounts:
            - name: config-vol
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: config-vol
              mountPath: /usr/share/nginx/html/index.html.template
              subPath: index.html.template
            - name: secret-volume
              mountPath: /mnt/secrets/secret-val
              readOnly: true
      volumes:
        - name: config-vol
          configMap:
            name: nginx-config
        - name: secret-volume
          secret:
            secretName: nginx-crypto-tracker-secret
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-crypto-tracker
  namespace: default
  labels:
    app.kubernetes.io/instance: crypto-tracker-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: nginx-crypto-tracker
---
apiVersion: dso.quantumsys.dev/v1alpha1
kind: DynamicSecretPolicy
metadata:
  name: nginx-crypto-policy
  namespace: default
spec:
  vaultRef:
    keyVaultURI: "https://<YOUR_KEYVAULT_NAME>.vault.azure.net"
    objectName: "database-password"
    objectType: "Secret"
  workloadSelector:
    kind: "Deployment"
    name: "nginx-crypto-tracker"
  rollbackConfig:
    autoRollback: true
    circuitBreakerThreshold: 3
