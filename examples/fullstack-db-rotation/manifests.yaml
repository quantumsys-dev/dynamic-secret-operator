# ==============================================================================
# Dynamic Secret Operator (DSO) – Fullstack Database Auto-Rotation Manifests
# Components: PostgreSQL, Go Status Backend, DSO Policy, and Azure Auto-Rotator CronJob
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: postgres-init-secret
  namespace: default
type: Opaque
stringData:
  POSTGRES_PASSWORD: "InitialPassword123!"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "appdb"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-init-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "appdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: db-password-secret
  namespace: default
type: Opaque
stringData:
  db-password: "InitialPassword123!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-status-app
  namespace: default
  labels:
    app: db-status-app
    app.kubernetes.io/instance: db-rotation-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: db-status-app
  template:
    metadata:
      labels:
        app: db-status-app
        app.kubernetes.io/instance: db-rotation-app
    spec:
      containers:
        - name: backend
          image: ghcr.io/quantumsys-dev/fullstack-db-rotation-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_NAME
              value: "appdb"
            - name: DB_PASSWORD_FILE
              value: "/mnt/secrets/db-password/db-password"
          volumeMounts:
            - name: secret-volume
              mountPath: /mnt/secrets/db-password
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: secret-volume
          secret:
            secretName: db-password-secret
---
apiVersion: v1
kind: Service
metadata:
  name: db-status-app
  namespace: default
  labels:
    app: db-status-app
    app.kubernetes.io/instance: db-rotation-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: db-status-app
---
apiVersion: dso.quantumsys.dev/v1alpha1
kind: DynamicSecretPolicy
metadata:
  name: db-status-policy
  namespace: default
spec:
  vaultRef:
    keyVaultURI: "https://<YOUR_KEYVAULT_NAME>.vault.azure.net"
    objectName: "db-password"
    objectType: "Secret"
  workloadSelector:
    kind: "Deployment"
    name: "db-status-app"
  validationProbes:
    - type: Postgres
      address: "postgres:5432"
      database: "appdb"
      username: "postgres"
      query: "SELECT 1;"
      queryTimeout: 5
      secretKey: "db-password"
  rollbackConfig:
    autoRollback: true
    circuitBreakerThreshold: 3
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-password-rotator
  namespace: default
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rotator
              image: mcr.microsoft.com/azure-cli:latest
              env:
                - name: KEYVAULT_NAME
                  value: "<YOUR_KEYVAULT_NAME>"
                - name: AZURE_TENANT_ID
                  value: "<YOUR_AZURE_TENANT_ID>"
                - name: AZURE_CLIENT_ID
                  value: "<YOUR_SERVICE_PRINCIPAL_CLIENT_ID>"
                - name: AZURE_CLIENT_SECRET
                  value: "<YOUR_SERVICE_PRINCIPAL_CLIENT_SECRET>"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  echo "🔄 Starting 5-minute automated database password rotation..."
                  
                  # 1. Install postgresql client
                  tdnf install -y postgresql || apt-get update && apt-get install -y postgresql-client || true

                  # 2. Generate new random password
                  NEW_PASS="Secret_$(openssl rand -hex 8)_$(date +%s)"
                  echo "🔑 Generated new password string."

                  # 3. Rotate user password inside PostgreSQL
                  echo "🗄️ Updating PostgreSQL database user credentials..."
                  # Note: In an automated cluster, the rotator uses postgres admin credentials or psql
                  psql -h postgres -U postgres -d appdb -c "ALTER USER postgres WITH PASSWORD '$NEW_PASS';" || echo "⚠️ Could not direct-update Postgres (verify network/auth)"

                  # 4. Authenticate to Azure CLI using Service Principal
                  echo "☁️ Logging into Azure CLI..."
                  az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" >/dev/null

                  # 5. Push rotated secret to Azure Key Vault
                  echo "🔐 Updating secret 'db-password' in Azure Key Vault '$KEYVAULT_NAME'..."
                  az keyvault secret set --vault-name "$KEYVAULT_NAME" --name "db-password" --value "$NEW_PASS" >/dev/null

                  echo "✅ Rotation complete! EventGrid -> Azure Service Bus will trigger DSO rollout."
