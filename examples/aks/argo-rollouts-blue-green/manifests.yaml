apiVersion: v1
kind: Service
metadata:
  name: payment-service-active
  namespace: default
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 80
      targetPort: 5678
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-preview
  namespace: default
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 80
      targetPort: 5678
  type: ClusterIP
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout-payment-service
  namespace: default
  labels:
    app: payment-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-service
  strategy:
    blueGreen:
      activeService: payment-service-active
      previewService: payment-service-preview
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-api
          image: hashicorp/http-echo:latest
          args: ["-text=Payment API live on AKS with DSO managed secret\n"]
          ports:
            - containerPort: 5678
              name: http
          volumeMounts:
            - name: db-secret-volume
              mountPath: /etc/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: db-secret-volume
          secret:
            secretName: rollout-payment-service-payment-db-password-initial
            optional: true
---
apiVersion: dso.quantumsys.dev/v1alpha1
kind: DynamicSecretPolicy
metadata:
  name: aks-rollout-payment-policy
  namespace: default
spec:
  vaultRef:
    keyVaultURI: "https://${KEYVAULT_NAME}.vault.azure.net"
    objectName: "payment-db-password"
    objectType: "Secret"
  workloadSelector:
    kind: "Rollout"
    name: "rollout-payment-service"
  targetRef:
    volumeName: "db-secret-volume"
  validationProbes:
    - type: "HTTP"
      endpoint: "http://payment-service-active.default.svc:80/"
      queryTimeout: 5
  rollbackConfig:
    autoRollback: true
    circuitBreakerThreshold: 3
