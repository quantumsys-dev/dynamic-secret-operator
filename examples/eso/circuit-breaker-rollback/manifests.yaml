apiVersion: v1
kind: Namespace
metadata:
  name: dso-circuit-breaker-demo
---
# 1. PostgreSQL Database Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: dso-circuit-breaker-demo
  labels:
    app: postgres-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: orders
            - name: POSTGRES_USER
              value: appuser
            - name: POSTGRES_PASSWORD
              value: valid-production-password-123
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: dso-circuit-breaker-demo
spec:
  selector:
    app: postgres-db
  ports:
    - port: 5432
      targetPort: 5432
---
# 2. Production API Service (Protected by Circuit Breaker)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: dso-circuit-breaker-demo
  labels:
    app: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: nginx:alpine
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: "postgres-db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-api-db-pass-initial
                  key: password
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-api-db-pass-initial
  namespace: dso-circuit-breaker-demo
type: Opaque
stringData:
  password: "valid-production-password-123"
---
# 3. Intermediate Secret Synchronized by ESO
apiVersion: v1
kind: Secret
metadata:
  name: eso-synced-orders-db-pass
  namespace: dso-circuit-breaker-demo
  labels:
    dso.quantumsys.dev/managed: "watch"
type: Opaque
stringData:
  password: "valid-production-password-123"
---
# 4. DynamicSecretPolicy with Circuit Breaker and PostgreSQL Synthetic Validation Probe
apiVersion: dso.quantumsys.dev/v1alpha1
kind: DynamicSecretPolicy
metadata:
  name: orders-api-policy
  namespace: dso-circuit-breaker-demo
spec:
  workloadSelector:
    kind: Deployment
    name: orders-api
  source:
    type: K8sSecret
    k8sSecret:
      name: eso-synced-orders-db-pass
  strategy: Canary
  networkPolicy:
    provider: Standard
  validationProbes:
    - type: PostgreSQL
      endpoint: "postgres-db.dso-circuit-breaker-demo.svc.cluster.local:5432/orders"
      queryTimeout: 3
  rollbackConfig:
    autoRollback: true
    circuitBreakerThreshold: 2
