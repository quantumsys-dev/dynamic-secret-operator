apiVersion: v1
kind: Namespace
metadata:
  name: dso-cilium-demo
---
# 1. Secured Backend Database (MySQL)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-db
  namespace: dso-cilium-demo
  labels:
    app: mysql-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-db
  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0-debian
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "demo-mysql-root-password-123"
            - name: MYSQL_DATABASE
              value: "payments"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-db
  namespace: dso-cilium-demo
spec:
  selector:
    app: mysql-db
  ports:
    - port: 3306
      targetPort: 3306
---
# 2. Target Production Workload
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: dso-cilium-demo
  labels:
    app: payment-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
    spec:
      containers:
        - name: processor
          image: nginx:alpine
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: "mysql-db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-processor-db-pass-initial
                  key: password
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-processor-db-pass-initial
  namespace: dso-cilium-demo
type: Opaque
stringData:
  password: "demo-mysql-root-password-123"
---
# 3. Synchronized ESO Secret
apiVersion: v1
kind: Secret
metadata:
  name: eso-synced-payment-db-pass
  namespace: dso-cilium-demo
  labels:
    dso.quantumsys.dev/managed: "watch"
type: Opaque
stringData:
  password: "demo-mysql-root-password-123"
---
# 4. DynamicSecretPolicy with eBPF Cilium Sandbox & Hubble Visibility
apiVersion: dso.quantumsys.dev/v1alpha1
kind: DynamicSecretPolicy
metadata:
  name: payment-processor-policy
  namespace: dso-cilium-demo
spec:
  workloadSelector:
    kind: Deployment
    name: payment-processor
  source:
    type: K8sSecret
    k8sSecret:
      name: eso-synced-payment-db-pass
  strategy: Canary
  networkPolicy:
    provider: Cilium
  validationProbes:
    - type: MySQL
      endpoint: "mysql-db.dso-cilium-demo.svc.cluster.local:3306/payments"
      queryTimeout: 5
  rollbackConfig:
    autoRollback: true
    circuitBreakerThreshold: 3
