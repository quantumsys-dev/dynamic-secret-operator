apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nginx-bg-color-eso
  namespace: dso-examples
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: ${SECRET_STORE_NAME}
    kind: ${SECRET_STORE_KIND}
  target:
    name: nginx-bg-color-synced
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Required for DSO to detect changes synced to this secret by ESO; see
          # docs/architecture/003-decoupling-secret-ingestion-eso.md
          dso.quantumsys.dev/managed: "watch"
  data:
    - secretKey: nginx-bg-color
      remoteRef:
        key: ${REMOTE_SECRET_NAME}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-color-template
  namespace: dso-examples
data:
  default.conf: |
    server {
      listen 80;
      server_name localhost;
      
      location / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><title>DSO Live on AKS</title></head><body style="background-color: {{BG_COLOR}}; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: system-ui, -apple-system, sans-serif; text-shadow: 0 2px 4px rgba(0,0,0,0.5);"><h1 style="font-size: 2.8rem; margin-bottom: 0.5rem;">Dynamic Secret Operator</h1><p style="font-size: 1.3rem; margin-top: 0; opacity: 0.95;">ESO Color Rotation Demo</p><div style="margin-top: 1.5rem; padding: 0.8rem 1.6rem; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); border-radius: 12px; font-family: monospace; font-size: 1.2rem; border: 1px solid rgba(255,255,255,0.2);">Active Background Color: <span style="font-weight: bold; letter-spacing: 1px;">{{BG_COLOR}}</span></div></body></html>\n';
      }

      location /health {
        default_type text/plain;
        return 200 'healthy\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-color-app
  namespace: dso-examples
  labels:
    app: nginx-color-app
    app.kubernetes.io/instance: dso-color-demo
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx-color-app
  template:
    metadata:
      labels:
        app: nginx-color-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          command:
            - /bin/sh
            - -c
            - |
              COLOR=$(cat /mnt/secrets/nginx-bg-color 2>/dev/null || echo "#3b82f6")
              if ! echo "$COLOR" | grep -Eq '^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$'; then
                COLOR="#3b82f6"
              fi
              sed "s/{{BG_COLOR}}/$COLOR/g" /etc/nginx/templates/default.conf > /etc/nginx/conf.d/default.conf
              exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: template-volume
              mountPath: /etc/nginx/templates
            - name: color-secret-volume
              mountPath: /mnt/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: template-volume
          configMap:
            name: nginx-color-template
        - name: color-secret-volume
          secret:
            secretName: nginx-color-app-nginx-bg-color-initial
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-color-app
  namespace: dso-examples
spec:
  selector:
    app: nginx-color-app
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: LoadBalancer
---
apiVersion: dso.quantumsys.dev/v1alpha1
kind: DynamicSecretPolicy
metadata:
  name: eso-nginx-color-policy
  namespace: dso-examples
spec:
  source:
    type: "K8sSecret"
    k8sSecret:
      name: "nginx-bg-color-synced"
  workloadSelector:
    kind: "Deployment"
    name: "nginx-color-app"
  targetRef:
    volumeName: "color-secret-volume"
  validationProbes:
    - type: Job
      job:
        timeoutSeconds: 30
        jobTemplate:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65534
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: validate-color
                    image: alpine:latest
                    imagePullPolicy: IfNotPresent
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      readOnlyRootFilesystem: true
                    volumeMounts:
                      - name: color-secret-volume
                        mountPath: /mnt/secrets
                        readOnly: true
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -e
                        echo "DSO Color Validation Probe: inspecting secret revision..."
                        COLOR=$(cat /mnt/secrets/nginx-bg-color 2>/dev/null || true)
                        echo "Secret value read: '$COLOR'"
                        if [ -z "$COLOR" ]; then
                          echo "ERROR: Secret 'nginx-bg-color' is empty!" >&2
                          exit 1
                        fi
                        if ! echo "$COLOR" | grep -Eq '^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$'; then
                          echo "FATAL: '$COLOR' is not a valid CSS hex color! Expected format: #RGB or #RRGGBB (e.g. #3b82f6 or #10b981)." >&2
                          exit 1
                        fi
                        echo "SUCCESS: Color '$COLOR' is a valid CSS hex color format."
                volumes:
                  - name: color-secret-volume
                    secret:
                      secretName: placeholder-will-be-mutated
  rollbackConfig:
    autoRollback: true
    circuitBreakerThreshold: 3
